# unbind keys
unbind-key -n C-S-Left
unbind-key -n C-S-Right

bind-key -n M-Left previous-window
bind-key -n M-Right next-window

#vim keys to move left and right
bind-key -n M-j previous-window 
bind-key -n M-k next-window

# vim keys to move left and right, up and down in panes
#
bind-key -n M-H select-pane -L
bind-key -n M-L select-pane -R
bind-key -n M-K select-pane -U
bind-key -n M-J select-pane -D



bind-key -n C-M-S-Left swap-window -t -1
bind-key -n C-M-S-Right swap-window -t +1
